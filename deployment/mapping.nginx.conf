# Dedicated OVEC Mapping virtual host. Included from NPM custom/http.conf.
server {
    listen 80;
    listen [::]:80;
    server_name mapping.utc.ac.th;
    return 301 https://mapping.utc.ac.th$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mapping.utc.ac.th;
    ssl_certificate /data/custom_ssl/npm-5/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/npm-5/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 25m;
    access_log /data/logs/mapping_access.log proxy;
    error_log /data/logs/mapping_error.log warn;
    resolver 127.0.0.11 valid=30s;
    set $mapping_upstream http://ovec-mapping-app:3000;
    location / {
        proxy_pass $mapping_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host mapping.utc.ac.th;
        proxy_set_header X-Forwarded-Host mapping.utc.ac.th;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header X-Test-Key "";
        proxy_set_header X-Test-Email "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
}
